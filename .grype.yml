ignore:
  # Go vulnerabilities in third-party binaries we install precompiled.
  # These tools are already pinned to latest releases; upstream must rebuild with patched dependencies.
  - vulnerability: GHSA-v778-237x-gjrc
    reason: "cloud-platform bundles vulnerable golang.org/x/crypto transitively; latest cloud-platform-cli release is 1.50.9. exp:2026-07-31"
  - vulnerability: GO-2024-3321-golang.org/x/crypto
    reason: "cloud-platform bundles vulnerable golang.org/x/crypto transitively; latest cloud-platform-cli release is 1.50.9. exp:2026-07-31"
  - vulnerability: GO-2026-5020-golang.org/x/crypto
    reason: "Affects cloud-platform, git-lfs, and ollama binaries. All are pinned to latest upstream releases in this repo. exp:2026-07-31"
  - vulnerability: GO-2026-5019-golang.org/x/crypto
    reason: "Affects cloud-platform, git-lfs, and ollama binaries. All are pinned to latest upstream releases in this repo. exp:2026-07-31"
  - vulnerability: GO-2026-5005-golang.org/x/crypto
    reason: "Affects cloud-platform, git-lfs, and ollama binaries. All are pinned to latest upstream releases in this repo. exp:2026-07-31"

  # Go stdlib vulnerabilities inside third-party binaries.
  # Cannot be patched here until upstream projects rebuild and release.
  - vulnerability: GO-2026-4337-stdlib
    reason: "Detected in cloud-platform and git-lfs binaries; requires upstream rebuild with fixed Go toolchain. exp:2026-07-31"
  - vulnerability: CVE-2025-68121
    reason: "Detected in cloud-platform and git-lfs binaries; requires upstream rebuild with fixed Go toolchain. exp:2026-07-31"
  - vulnerability: CVE-2026-27140
    reason: "Detected in cloud-platform, git-lfs, and ollama binaries; requires upstream rebuild with fixed Go toolchain. exp:2026-07-31"
  - vulnerability: CVE-2026-27143
    reason: "Detected in cloud-platform, git-lfs, and ollama binaries; requires upstream rebuild with fixed Go toolchain. exp:2026-07-31"

  # Ubuntu package vulnerability with no fixed candidate currently in configured apt repos.
  - vulnerability: CVE-2026-42010
    reason: "libgnutls30t64 fix 3.8.3-1.1ubuntu3.6 is not currently available in apt sources for this build environment. exp:2026-07-31"
  - vulnerability: CVE-2026-33845
    reason: "libgnutls30t64 fix 3.8.3-1.1ubuntu3.6 is not currently available in apt sources for this build environment. exp:2026-07-31"

  # Miniconda-managed binaries: py312 track is already at latest installer in this Dockerfile.
  - vulnerability: CVE-2026-6100
    reason: "Detected in /opt/conda/bin/python3.12; Miniconda py312 installer is already at latest available version in this repo. exp:2026-07-31"
  - vulnerability: CVE-2026-34182
    reason: "Detected in /opt/conda/bin/openssl; scanner fixed version metadata appears inconsistent for this conda-managed binary. exp:2026-07-31"
