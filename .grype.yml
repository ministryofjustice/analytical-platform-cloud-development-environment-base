# Grype configuration file for container vulnerability scanning
# https://github.com/anchore/grype#configuration
#
# Reconciled against the 2026-10-02 scan (25 critical, 178 high) run with ignores
# disabled. Entries no longer appearing in that scan have been removed; entries
# still appearing have been reinstated (with refreshed `exp` dates); new findings
# have been added.
#
# 2026-10-12: a further Go stdlib (1.26.9) / golang.org/x/net (0.60.0) security round
# (GO-2026-6603 to GO-2026-6617) affects gh 2.102.0 and aws-sso-cli 2.3.2. Both are
# the latest upstream releases (checked 2026-10-16), so these are ignored pending
# upstream rebuilds. The two criticals are scoped to the affected binaries and carry
# a shorter expiry.
#
# 2026-10-16: helm bumped to 4.3.1 (x/net v0.60.0, built with go1.27.x after the
# go1.27.2 security release), so helm-scoped ignores for this round have been removed.

ignore:
  # Suppress all Go-module findings from selected third-party precompiled binaries.
  # These tools are consumed as binaries and must be fixed upstream. This also covers
  # the vast majority of the cloud-platform/ollama/git-lfs stdlib and golang.org/x/*
  # findings in the 2026-10-02 scan, so those are not individually listed below.
  - package:
      type: go-module
      location: "/usr/local/bin/cloud-platform"
    reason: "Third-party precompiled binary; Go module vulnerabilities require upstream rebuild/release. exp:2026-11-01"
  - package:
      type: go-module
      location: "/usr/local/bin/git-lfs"
    reason: "Third-party precompiled binary; Go module vulnerabilities require upstream rebuild/release. exp:2026-11-01"
  - package:
      type: go-module
      location: "/usr/bin/ollama"
    reason: "Third-party precompiled binary; Go module vulnerabilities require upstream rebuild/release. exp:2026-11-01"
  - package:
      type: go-module
      location: "/usr/local/bin/kubectl"
    reason: "Third-party precompiled binary; Go module vulnerabilities require upstream rebuild/release. exp:2026-11-01"

