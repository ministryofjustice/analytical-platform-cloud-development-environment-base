# Grype configuration file for container vulnerability scanning
# https://github.com/anchore/grype#configuration

ignore:
  # Ubuntu package vulnerability with no fixed candidate currently in configured apt repos.
  - vulnerability: CVE-2026-54371
    reason: "libattr1 1:2.5.2-1build1.1 is a transitive dependency baked into the Ubuntu 24.04 base image, not explicitly installed by this Dockerfile; fix 1:2.5.2-1ubuntu0.1 requires an upstream base image refresh to pick up. exp:2026-10-03"

  # Additional findings from image <fill in current image digest> (2026-08-14).
  # Go stdlib vulnerabilities in aws-sso-cli, helm, and gh — all three are precompiled binaries
  # pinned to the latest available upstream release; the fixed Go toolchains postdate those
  # releases, so there is nothing to bump to yet.
  - vulnerability: GO-2026-5026
    package:
      type: go-module
      location: "/usr/local/bin/aws-sso"
    reason: "stdlib fixed in 1.25.13; aws-sso-cli 2.3.1 is the latest upstream release and predates this fix. exp:2026-09-11"
  - vulnerability: GO-2026-5026
    package:
      type: go-module
      location: "/usr/local/bin/helm"
    reason: "stdlib fixed in 1.25.13; helm 4.2.3 (released 2026-07-09) predates this fix. exp:2026-09-11"
  - vulnerability: GO-2026-5026
    package:
      type: go-module
      location: "/usr/bin/gh"
    reason: "stdlib fixed in 1.25.13; gh 2.97.0 is the latest upstream release and predates this fix. exp:2026-09-11"
  - vulnerability: GO-2026-5942
    package:
      type: go-module
      location: "/usr/local/bin/aws-sso"
    reason: "stdlib fixed in 1.26.6 (released 2026-08-13); no aws-sso-cli release has been rebuilt against it yet, latest is 2.3.1. exp:2026-09-11"
  - vulnerability: GO-2026-5942
    package:
      type: go-module
      location: "/usr/local/bin/helm"
    reason: "stdlib fixed in 1.26.6 (released 2026-08-13); helm 4.2.3 (2026-07-09) predates it and next minor 4.3.0 isn't scheduled until 2026-09-09. exp:2026-09-11"
  - vulnerability: GO-2026-5942
    package:
      type: go-module
      location: "/usr/bin/gh"
    reason: "stdlib fixed in 1.26.6 (released 2026-08-13); no gh release has been rebuilt against it yet, latest is 2.97.0. exp:2026-09-11"

