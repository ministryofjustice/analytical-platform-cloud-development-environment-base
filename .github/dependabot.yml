---
version: 2

updates:
  - package-ecosystem: "devcontainers"
    commit-message:
      include: "scope"
      prefix: ":dependabot: devcontainers"
    cooldown:
      default-days: 7
      exclude:
        - "ghcr.io/ministryofjustice/devcontainer-feature/*"
    directory: "/"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    commit-message:
      include: "scope"
      prefix: ":dependabot: docker"
    cooldown:
      default-days: 7
    directory: "/"
    ignore:
      # Stay on Ubuntu 24.04 LTS; only accept digest updates for 24.04
      - dependency-name: "library/ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    commit-message:
      include: "scope"
      prefix: ":dependabot: github-actions"
    cooldown:
      default-days: 7
      exclude:
        - "ministryofjustice/action*"
        - "ministryofjustice/analytical-platform-github-actions*"
    directory: "/"
    groups:
      analytical-platform-github-actions:
        patterns:
          - "ministryofjustice/analytical-platform-github-actions*"
    open-pull-requests-limit: 15
    schedule:
      interval: "daily"
