---
name: Super Linter

"on":
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  super-linter:
    name: Super Linter
    permissions:
      contents: read
      packages: read
      statuses: write
    uses: ministryofjustice/data-platform-github-actions/.github/workflows/super-linter.yml@c8dbd40674f1a0401e516e51cd6fa61c7f4fdc23 # v4.1.0
    with:
      # FILTER_REGEX_EXCLUDE excludes prompt files - they're for AI consumption, not human documentation
      super-linter-variables: |
        {
          "FILTER_REGEX_EXCLUDE": ".github/prompts/.*"
        }
